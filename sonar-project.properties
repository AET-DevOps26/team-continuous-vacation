sonar.projectName=TripTailor

sonar.sources=backend/src/main/kotlin,persistence-service/src/main/kotlin,frontend/src,genai-service/app,travel-context-service/app,infrastructure,api-specification
sonar.tests=backend/src/test/kotlin,persistence-service/src/test/kotlin,frontend/src,genai-service/tests,travel-context-service/tests

sonar.exclusions=**/build/**,**/dist/**,**/node_modules/**,**/.venv/**,**/venv/**,**/coverage/**,**/htmlcov/**,frontend/src/lib/api-types.ts,frontend/src/components/ui/**,frontend/src/components/refine-ui/**
sonar.coverage.exclusions=**/*test*/**,**/*.test.ts,**/*.test.tsx,**/tests/**,**/config/**,**/DemoApplication.kt

sonar.javascript.lcov.reportPaths=.sonar/coverage/frontend.lcov
sonar.coverage.jacoco.xmlReportPaths=.sonar/coverage/backend-jacoco.xml,.sonar/coverage/persistence-service-jacoco.xml
sonar.python.coverage.reportPaths=.sonar/coverage/genai-service-coverage.xml,.sonar/coverage/travel-context-service-coverage.xml
