global:
  # Always pull so mutable tags (e.g. latest / short SHA) are refreshed and to
  # satisfy KICS "Image Pull Policy ... Not Set To Always".
  imagePullPolicy: Always
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

tracing:
  enabled: true
  otlpEndpoint: http://tempo:4318/v1/traces
  samplingProbability: "1.0"

networkPolicy:
  enabled: true
  # Labels used by the ingress controller pods that forward public traffic to
  # this release. Override these when the cluster uses a different controller.
  ingressController:
    namespaceLabels:
      kubernetes.io/metadata.name: ingress-nginx
    podLabels:
      app.kubernetes.io/name: ingress-nginx

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 17-alpine
  service:
    name: db
    port: 5432
  auth:
    database: triptailor
    username: tripuser
    password: trippassword
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

genaiService:
  image:
    repository: triptailor/genai-service
    tag: latest
  service:
    name: genai-service
    port: 8000
  replicaCount: 1
  config:
    LLM_PROVIDER: local
    AZURE_LLM_BASE_URL: https://example.invalid/
    AZURE_LLM_API_VERSION: 2024-12-01-preview
    MODEL_NAME: gpt-5-nano
    TEMPERATURE: "0.7"
    MAX_TOKENS: "8000"
    LOCAL_LLM_API_KEY: ollama
    LOCAL_LLM_BASE_URL: http://localhost:11434/v1
    LOG_LEVEL: INFO
  secrets:
    AZURE_LLM_API_KEY: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

travelContextService:
  image:
    repository: triptailor/travel-context-service
    tag: latest
  service:
    name: travel-context-service
    port: 8090
  replicaCount: 1
  config:
    NOMINATIM_BASE_URL: https://nominatim.openstreetmap.org
    PHOTON_BASE_URL: https://photon.komoot.io
    SERPAPI_BASE_URL: https://serpapi.com/search
    OPEN_METEO_FORECAST_BASE_URL: https://api.open-meteo.com/v1/forecast
    OPEN_METEO_ARCHIVE_BASE_URL: https://archive-api.open-meteo.com/v1/archive
    WEATHER_ENABLED: "true"
    WEATHER_FORECAST_MAX_DAYS: "15"
    HTTP_USER_AGENT: "TripTailor/1.0 (https://github.com/AET-DevOps26/team-continuous-vacation)"
    EVENT_SEARCH_LIMIT: "10"
    CACHE_TTL_SECONDS: "21600"
  secrets:
    SERPAPI_API_KEY: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

backend:
  image:
    repository: triptailor/backend
    tag: latest
  service:
    name: backend
    type: ClusterIP
    port: 8080
  replicaCount: 1
  config:
    JWT_ISSUER: triptailor-app-api
    JWT_TTL_DAYS: "30"
  secrets:
    JWT_SECRET: dev-only-change-this-secret-to-at-least-32-bytes
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

frontend:
  image:
    repository: triptailor/frontend
    tag: latest
  service:
    name: frontend
    type: ClusterIP
    port: 3000
    nodePort: null
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

monitoring:
  enabled: true
  prometheus:
    image:
      repository: prom/prometheus
      tag: v3.11.0
    retention: 7d
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: 12.3.0
    service:
      name: grafana
      port: 3000
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  tempo:
    enabled: true
    image:
      repository: grafana/tempo
      tag: 2.9.0
    service:
      name: tempo
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  api:
    enabled: true
    path: /api(/|$)(.*)
    pathType: ImplementationSpecific
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      nginx.ingress.kubernetes.io/proxy-body-size: 64k
  # Expose Grafana/Prometheus under subpaths on the same host. Requires
  # monitoring.enabled (and grafana.enabled) so the backing service exists.
  # The monitoring pods are reconfigured to serve from these prefixes.
  grafana:
    enabled: true
    path: /grafana
    pathType: Prefix
  prometheus:
    enabled: true
    path: /prometheus
    pathType: Prefix
  hosts:
    - host: triptailor.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
