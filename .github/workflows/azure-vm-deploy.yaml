name: Deploy to Azure VM

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: Terraform action to run
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy
      deploy_after_apply:
        description: Run Ansible deployment after Terraform apply
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches: [ "main" ]

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'triptailor-rg' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'polandcentral' }}
  AZURE_VM_SIZE: ${{ vars.AZURE_VM_SIZE || 'Standard_B2ats_v2' }}
  AZURE_VM_ADMIN_USERNAME: ${{ vars.AZURE_VM_ADMIN_USERNAME || 'tripadmin' }}
  AZURE_PUBLIC_IP_DNS_LABEL: ${{ vars.AZURE_PUBLIC_IP_DNS_LABEL || 'tum-triptailor-354f93b6' }}
  AZURE_ACME_EMAIL: ${{ vars.AZURE_ACME_EMAIL || 'f.hoppe@tum.de' }}
  AZURE_LLM_BASE_URL: ${{ vars.AZURE_LLM_BASE_URL || secrets.AZURE_LLM_BASE_URL }}
  AZURE_MONTHLY_BUDGET_AMOUNT: ${{ vars.AZURE_MONTHLY_BUDGET_AMOUNT || '78' }}
  AZURE_MONTHLY_BUDGET_START_DATE: ${{ vars.AZURE_MONTHLY_BUDGET_START_DATE || '2026-07-01T00:00:00Z' }}
  AZURE_MONTHLY_BUDGET_END_DATE: ${{ vars.AZURE_MONTHLY_BUDGET_END_DATE || '2027-07-01T00:00:00Z' }}
  AZURE_BUDGET_ALERT_EMAIL_ADDRESSES: ${{ vars.AZURE_BUDGET_ALERT_EMAIL_ADDRESSES || '' }}

jobs:
  deploy:
    name: Provision and deploy
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Prepare VM public key
        env:
          AZURE_VM_SSH_PUBLIC_KEY: ${{ secrets.AZURE_VM_SSH_PUBLIC_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$AZURE_VM_SSH_PUBLIC_KEY" > "$RUNNER_TEMP/ssh/triptailor.pub"
          chmod 600 "$RUNNER_TEMP/ssh/triptailor.pub"

      - name: Terraform fmt
        working-directory: infrastructure/terraform
        run: terraform fmt -check

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: infrastructure/terraform
        env:
          # Pass untrusted workflow inputs / secrets through the environment instead of
          # interpolating them into the shell script (zizmor template-injection).
          TERRAFORM_ACTION: ${{ github.event.inputs.terraform_action }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          plan_args=()
          if [ "$TERRAFORM_ACTION" = "destroy" ]; then
            plan_args+=("-destroy")
          fi

          terraform plan "${plan_args[@]}" -out=tfplan \
            -var="subscription_id=${SUBSCRIPTION_ID}" \
            -var="resource_group_name=${AZURE_RESOURCE_GROUP}" \
            -var="location=${AZURE_LOCATION}" \
            -var="vm_size=${AZURE_VM_SIZE}" \
            -var="admin_username=${AZURE_VM_ADMIN_USERNAME}" \
            -var="public_ip_dns_label=${AZURE_PUBLIC_IP_DNS_LABEL}" \
            -var="ssh_public_key_path=$RUNNER_TEMP/ssh/triptailor.pub" \
            -var="monthly_budget_amount=${AZURE_MONTHLY_BUDGET_AMOUNT}" \
            -var="monthly_budget_start_date=${AZURE_MONTHLY_BUDGET_START_DATE}" \
            -var="monthly_budget_end_date=${AZURE_MONTHLY_BUDGET_END_DATE}" \
            -var="budget_alert_email_addresses=${AZURE_BUDGET_ALERT_EMAIL_ADDRESSES}"

      - name: Terraform apply
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Capture VM IP
        id: terraform_output
        if: github.event.inputs.terraform_action != 'destroy'
        working-directory: infrastructure/terraform
        run: |
          vm_public_ip="$(terraform output -raw vm_public_ip)"
          vm_public_fqdn="$(terraform output -raw vm_public_fqdn)"
          echo "vm_public_ip=${vm_public_ip}" >> "$GITHUB_OUTPUT"
          echo "vm_public_fqdn=${vm_public_fqdn}" >> "$GITHUB_OUTPUT"

      - name: Ensure VM running
        if: github.event.inputs.terraform_action != 'destroy' && (github.event_name == 'push' || github.event.inputs.deploy_after_apply == 'true')
        run: az vm start --resource-group "${AZURE_RESOURCE_GROUP}" --name triptailor-vm

      - name: Install Ansible
        if: github.event.inputs.terraform_action != 'destroy' && (github.event_name == 'push' || github.event.inputs.deploy_after_apply == 'true')
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Prepare Ansible SSH
        if: github.event.inputs.terraform_action != 'destroy' && (github.event_name == 'push' || github.event.inputs.deploy_after_apply == 'true')
        env:
          AZURE_VM_SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
          VM_PUBLIC_IP: ${{ steps.terraform_output.outputs.vm_public_ip }}
        run: |
          printf '%s\n' "$AZURE_VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/triptailor"
          chmod 600 "$RUNNER_TEMP/ssh/triptailor"

          cat > "$RUNNER_TEMP/inventory.ini" <<EOF
          [triptailor]
          ${VM_PUBLIC_IP} ansible_user=${AZURE_VM_ADMIN_USERNAME} ansible_ssh_private_key_file=${RUNNER_TEMP}/ssh/triptailor ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

          for attempt in {1..30}; do
            if ssh -i "$RUNNER_TEMP/ssh/triptailor" \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              "${AZURE_VM_ADMIN_USERNAME}@${VM_PUBLIC_IP}" true; then
              exit 0
            fi

            echo "Waiting for SSH on ${VM_PUBLIC_IP} (${attempt}/30)..."
            sleep 10
          done

          echo "VM did not become reachable over SSH." >&2
          exit 1

      - name: Deploy with Ansible
        if: github.event.inputs.terraform_action != 'destroy' && (github.event_name == 'push' || github.event.inputs.deploy_after_apply == 'true')
        env:
          AZURE_LLM_API_KEY: ${{ secrets.AZURE_LLM_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VM_PUBLIC_FQDN: ${{ steps.terraform_output.outputs.vm_public_fqdn }}
        run: |
          if [ -z "${AZURE_LLM_API_KEY}" ] || [ -z "${AZURE_LLM_BASE_URL}" ]; then
            echo "AZURE_LLM_API_KEY and AZURE_LLM_BASE_URL repository secrets are required." >&2
            exit 1
          fi

          POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-trippassword}"
          JWT_SECRET="${JWT_SECRET:-dev-only-change-this-secret-to-at-least-32-bytes}"

          ansible-playbook -i "$RUNNER_TEMP/inventory.ini" infrastructure/ansible/playbook.yml \
            -e "repo_url=https://github.com/${GITHUB_REPOSITORY}.git" \
            -e "branch=${GITHUB_REF_NAME}" \
            -e "azure_llm_api_key=${AZURE_LLM_API_KEY}" \
            -e "azure_llm_base_url=${AZURE_LLM_BASE_URL}" \
            -e "public_hostname=${VM_PUBLIC_FQDN}" \
            -e "acme_email=${AZURE_ACME_EMAIL}" \
            -e "serpapi_api_key=${SERPAPI_API_KEY}" \
            -e "postgres_password=${POSTGRES_PASSWORD}" \
            -e "jwt_secret=${JWT_SECRET}"

      - name: Show application URL
        if: github.event.inputs.terraform_action != 'destroy' && (github.event_name == 'push' || github.event.inputs.deploy_after_apply == 'true')
        env:
          VM_PUBLIC_IP: ${{ steps.terraform_output.outputs.vm_public_ip }}
          VM_PUBLIC_FQDN: ${{ steps.terraform_output.outputs.vm_public_fqdn }}
        run: |
          echo "Frontend HTTPS: https://${VM_PUBLIC_FQDN}"
          echo "Frontend HTTP fallback: http://${VM_PUBLIC_FQDN}:3000"
          echo "Frontend IP fallback: http://${VM_PUBLIC_IP}:3000"
          echo "Backend API: https://${VM_PUBLIC_FQDN}/api/"
