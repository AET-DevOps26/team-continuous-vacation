name: TripTailor CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least-privilege default; only the coverage-report job that comments on PRs
# widens this at the job level.
permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint
      - name: Run Tests
        run: npm run test
      - name: Generate coverage report
        run: npm run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
      - name: Build
        run: npm run build

  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build and Test with Gradle
        run: ./gradlew build
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/
          if-no-files-found: error

  build-genai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./genai-service
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ./genai-service/requirements.txt
            ./genai-service/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint with flake8
        run: flake8 app tests --count --show-source --statistics
      - name: Type check with mypy
        run: mypy app
      - name: Test with coverage
        run: |
          pytest --verbose --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=80
      - name: Upload GenAI coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genai-service-coverage
          path: |
            genai-service/coverage.xml
            genai-service/htmlcov/
          if-no-files-found: error

  build-travel-context:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./travel-context-service
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ./travel-context-service/requirements.txt
            ./travel-context-service/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint with flake8
        run: flake8 app tests --count --show-source --statistics
      - name: Type check with mypy
        run: mypy app
      - name: Test with coverage
        run: |
          pytest --verbose --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=80
      - name: Upload travel context coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: travel-context-service-coverage
          path: |
            travel-context-service/coverage.xml
            travel-context-service/htmlcov/
          if-no-files-found: error

  coverage-report:
    needs: [build-frontend, build-backend, build-genai, build-travel-context]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      COVERAGE_THRESHOLD: "80"
      NEEDS_JSON: ${{ toJson(needs) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: .coverage-artifacts
      - name: Create coverage summary
        run: node scripts/coverage-report.mjs
      - name: Publish PR coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- triptailor-coverage-report -->";
            const body = fs.readFileSync("coverage-summary.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - name: Verify coverage gate
        run: node scripts/coverage-report.mjs --check

  verify-docker-compose:
    needs: [coverage-report]
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: triptailor-ci
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Validate Docker Compose config
        run: docker compose config --quiet
      - name: Build Docker images
        run: docker compose build
      - name: Scan application images
        run: |
          for image in $(docker compose images --format '{{.Repository}}:{{.Tag}}' | grep '^triptailor-ci-'); do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.70.0 image \
              --exit-code 1 --ignore-unfixed --pkg-types os \
              --severity HIGH,CRITICAL "${image}"
          done
      - name: Start Docker Compose stack
        run: docker compose up --detach --wait --wait-timeout 240
      - name: Smoke test Docker Compose stack
        run: bash scripts/docker-compose-smoke.sh
      - name: Exercise concurrent Python service requests
        run: python3 scripts/load-test-python-services.py --requests 12 --concurrency 4
      - name: Dump Docker Compose logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
