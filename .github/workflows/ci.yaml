name: TripTailor CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint
      - name: Run Tests
        run: npm run test
      - name: Generate coverage report
        run: npm run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
      - name: Build
        run: npm run build

  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build and Test with Gradle
        run: ./gradlew build
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/
          if-no-files-found: error

  build-persistence-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./persistence-service
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build and Test with Gradle
        run: ./gradlew build
      - name: Upload persistence coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistence-service-coverage
          path: persistence-service/build/reports/jacoco/test/
          if-no-files-found: error

  build-genai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./genai-service
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ./genai-service/requirements.txt
            ./genai-service/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint with flake8
        run: flake8 app tests --count --show-source --statistics
      - name: Type check with mypy
        run: mypy app
      - name: Test with coverage
        run: |
          pytest --verbose --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=80
      - name: Upload GenAI coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genai-service-coverage
          path: |
            genai-service/coverage.xml
            genai-service/htmlcov/
          if-no-files-found: error

  build-travel-context:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./travel-context-service
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ./travel-context-service/requirements.txt
            ./travel-context-service/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint with flake8
        run: flake8 app tests --count --show-source --statistics
      - name: Type check with mypy
        run: mypy app
      - name: Test with coverage
        run: |
          pytest --verbose --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=80
      - name: Upload travel context coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-context-service-coverage
          path: |
            travel-context-service/coverage.xml
            travel-context-service/htmlcov/
          if-no-files-found: error

  coverage-report:
    needs: [build-frontend, build-backend, build-genai, build-persistence-service, build-travel-context]
    if: always()
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: "80"
      NEEDS_JSON: ${{ toJson(needs) }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: .coverage-artifacts
      - name: Create coverage summary
        run: node scripts/coverage-report.mjs
      - name: Publish PR coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- triptailor-coverage-report -->";
            const body = fs.readFileSync("coverage-summary.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - name: Prepare SonarQube Cloud coverage
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != ''
        run: node scripts/prepare-sonar-coverage.mjs
      - name: Run SonarQube Cloud scan
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != ''
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Verify coverage gate
        run: node scripts/coverage-report.mjs --check

  verify-docker-compose:
    needs: [coverage-report]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker images
        run: docker compose build
